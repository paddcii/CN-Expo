<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CN Voucher</title>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <img src="/img/CN3.png" alt="Logo CN" class="logo">

        <!-- Teks keterangan -->
        <p class="subtitle">Silahkan Masukkan Username dan Password Pada Voucher</p>
        
        <form action="/html/status.html" method="get"> <!-- Ganti welcome.html dengan halaman tujuanmu -->
            <div class="input-group">
                <i data-feather="user" class="input-icon"></i>
                <input type="text" name="username" placeholder="Username" required>
            </div>
            
            <div class="input-group">
                <i data-feather="lock" class="input-icon"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            
            <button type="submit" class="connect-btn">Connect</button>
        </form>
    </div>

    <script>
        feather.replace();
    </script>
</body>
</html>
