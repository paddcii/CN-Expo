<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - CN Voucher</title>
    <link rel="stylesheet" href="/css/logout.css">
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <img src="/img/CN3.png" alt="Logo CN" class="logo">

        <!-- Judul utama -->
        <h1 class="title">You have just logged out!</h1>

        <!-- Informasi session terakhir -->
        <div class="info-table">
            <div class="info-row">
                <span class="label">Username</span>
                <span class="value">y2k</span>
            </div>
            <div class="info-row">
                <span class="label">IP address</span>
                <span class="value">10.10.10.17</span>
            </div>

            <div class="info-row">
                <span class="label">MAC address</span>
                <span class="value">00:1B:44:11:3A:B7</span>
            </div>

            <div class="info-row">
                <span class="label">Session time</span>
                <span class="value">00.00.07</span>
            </div>
            <div class="info-row">
                <span class="label">Bytes up / down</span>
                <span class="value">590b / 890b</span>
            </div>
        </div>

        <!-- Tombol kembali ke login -->
        <a href="/html/login.html" class="login-btn">Log in</a>
    </div>
</body>
</html>
