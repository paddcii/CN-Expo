<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status - CN Voucher</title>
    <link rel="stylesheet" href="/css/status.css">
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <img src="/img/CN3.png" alt="Logo CN" class="logo">

        <!-- Pesan selamat datang -->
        <h1 class="greeting">Hi, y2k!</h1>

        <!-- Informasi status -->
        <div class="info-table">
            <div class="info-row">
                <span class="label">IP address</span>
                <span class="value">10.10.10.17</span>
            </div>
            <div class="info-row">
                <span class="label">Bytes up / down</span>
                <span class="value">85kb/s / 100kb/s</span>
            </div>
            <div class="info-row">
                <span class="label">Connected / left</span>
                <span class="value">00.39.55</span>
            </div>
            <div class="info-row">
                <span class="label">Connected</span>
                <span class="value">00.21.55</span>
            </div>
            <div class="info-row">
                <span class="label">Status refresh</span>
                <span class="value">1h</span>
            </div>
        </div>

        <!-- Tombol Log out -->
        <a href="/html/logout.html" class="logout-btn">Log out</a>
    </div>
</body>
</html>
